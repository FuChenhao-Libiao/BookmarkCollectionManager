<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 AI 音乐生成器</title>
    <style>
        /* ========== 全局样式 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #1a1a3e, #24243e);
            color: #e0e0e0;
            min-height: 100vh;
        }

        /* ========== 头部导航 ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .header h1 {
            font-size: 24px;
            background: linear-gradient(90deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #fbbf24;
            display: inline-block;
        }
        .status-dot.ready { background: #34d399; }
        .status-dot.error { background: #f87171; }

        .btn-link {
            color: #a78bfa;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 16px;
            border: 1px solid rgba(167,139,250,0.3);
            border-radius: 8px;
            transition: all 0.2s;
        }
        .btn-link:hover {
            background: rgba(167,139,250,0.1);
            border-color: #a78bfa;
        }

        /* ========== 主内容区 ========== */
        .main {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* ========== 输入区域 ========== */
        .input-section {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
        }

        .input-section label {
            display: block;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #c4b5fd;
        }

        .prompt-input {
            width: 100%;
            padding: 16px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            resize: vertical;
            min-height: 80px;
            outline: none;
            transition: border-color 0.2s;
        }
        .prompt-input:focus {
            border-color: #a855f7;
        }
        .prompt-input::placeholder { color: #666; }

        /* ========== 风格选择 ========== */
        .styles-section {
            margin-top: 24px;
        }

        .style-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
        }

        .style-tag {
            padding: 8px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            user-select: none;
        }
        .style-tag:hover {
            background: rgba(168,85,247,0.15);
            border-color: rgba(168,85,247,0.4);
        }
        .style-tag.active {
            background: linear-gradient(135deg, rgba(168,85,247,0.3), rgba(59,130,246,0.3));
            border-color: #a855f7;
            color: #fff;
        }

        /* ========== 参数控制 ========== */
        .params-section {
            margin-top: 24px;
        }

        .params-row {
            display: flex;
            gap: 24px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .duration-options {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .duration-btn {
            padding: 8px 20px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #ccc;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .duration-btn:hover { background: rgba(168,85,247,0.15); }
        .duration-btn.active {
            background: linear-gradient(135deg, rgba(168,85,247,0.3), rgba(59,130,246,0.3));
            border-color: #a855f7;
            color: #fff;
        }

        /* 高级参数折叠 */
        .advanced-toggle {
            color: #8b8ba7;
            font-size: 13px;
            cursor: pointer;
            margin-top: 16px;
            user-select: none;
        }
        .advanced-toggle:hover { color: #a78bfa; }

        .advanced-params {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
        }
        .advanced-params.show { display: block; }

        .slider-group {
            margin-bottom: 16px;
        }
        .slider-group:last-child { margin-bottom: 0; }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #8b8ba7;
            margin-bottom: 6px;
        }

        .slider-group input[type="range"] {
            width: 100%;
            appearance: none;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            outline: none;
        }
        .slider-group input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 16px; height: 16px;
            background: #a855f7;
            border-radius: 50%;
            cursor: pointer;
        }

        /* ========== 生成按钮 ========== */
        .generate-btn {
            width: 100%;
            padding: 16px;
            margin-top: 28px;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .generate-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 30px rgba(168,85,247,0.3);
        }
        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ========== 加载动画 ========== */
        .loading-section {
            display: none;
            text-align: center;
            padding: 40px 0;
        }
        .loading-section.show { display: block; }

        .loading-bars {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-bottom: 16px;
        }
        .loading-bars span {
            width: 4px;
            height: 20px;
            background: #a855f7;
            border-radius: 2px;
            animation: bars 1s ease-in-out infinite;
        }
        .loading-bars span:nth-child(2) { animation-delay: 0.1s; }
        .loading-bars span:nth-child(3) { animation-delay: 0.2s; }
        .loading-bars span:nth-child(4) { animation-delay: 0.3s; }
        .loading-bars span:nth-child(5) { animation-delay: 0.4s; }
        .loading-bars span:nth-child(6) { animation-delay: 0.5s; }
        .loading-bars span:nth-child(7) { animation-delay: 0.6s; }

        @keyframes bars {
            0%, 100% { height: 20px; opacity: 0.4; }
            50% { height: 40px; opacity: 1; }
        }

        .loading-text {
            color: #8b8ba7;
            font-size: 14px;
        }

        /* ========== 播放器区域 ========== */
        .player-section {
            display: none;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 28px;
            margin-top: 24px;
        }
        .player-section.show { display: block; }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .player-title {
            font-size: 16px;
            font-weight: 600;
            color: #c4b5fd;
        }

        .player-info {
            font-size: 12px;
            color: #666;
        }

        .audio-player {
            width: 100%;
            margin: 12px 0;
            border-radius: 8px;
            outline: none;
        }

        /* 自定义音频播放器样式 */
        audio::-webkit-media-controls-panel {
            background: rgba(30,30,50,0.8);
        }

        .player-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn-download {
            background: linear-gradient(135deg, #34d399, #059669);
            color: #fff;
        }
        .btn-download:hover {
            box-shadow: 0 4px 15px rgba(52,211,153,0.3);
        }

        .btn-regenerate {
            background: rgba(255,255,255,0.08);
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .btn-regenerate:hover {
            background: rgba(255,255,255,0.12);
        }

        /* ========== 提示消息 ========== */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 1000;
            transform: translateX(120%);
            transition: transform 0.3s ease;
        }
        .toast.show { transform: translateX(0); }
        .toast.error {
            background: rgba(239,68,68,0.9);
            color: #fff;
        }
        .toast.success {
            background: rgba(52,211,153,0.9);
            color: #fff;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 640px) {
            .header { padding: 16px 20px; }
            .header h1 { font-size: 20px; }
            .main { padding: 20px 16px; }
            .input-section { padding: 20px; }
            .params-row { flex-direction: column; gap: 12px; }
        }
    </style>
</head>
<body>

<!-- 头部导航 -->
<header class="header">
    <h1>🎵 AI 音乐生成器</h1>
    <div class="header-right">
        <span id="statusText">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusLabel" style="font-size:13px; margin-left:6px;">连接中...</span>
        </span>
        <a href="history.html" class="btn-link">📋 历史记录</a>
    </div>
</header>

<!-- 主内容 -->
<main class="main">

    <!-- 输入区域 -->
    <div class="input-section">
        <label>📝 描述你想要的音乐</label>
        <textarea class="prompt-input" id="promptInput"
                  placeholder="例如：欢快的钢琴曲，适合早晨听 / 紧张刺激的电子音乐 / 温柔浪漫的吉他旋律..."></textarea>

        <!-- 风格选择 -->
        <div class="styles-section">
            <label>🎭 快捷风格</label>
            <div class="style-tags" id="styleTags">
                <!-- 动态填充 -->
            </div>
        </div>

        <!-- 时长选择 -->
        <div class="params-section">
            <label>⏱️ 时长</label>
            <div class="duration-options" id="durationOptions">
                <button class="duration-btn" data-value="5">5秒</button>
                <button class="duration-btn active" data-value="10">10秒</button>
                <button class="duration-btn" data-value="15">15秒</button>
                <button class="duration-btn" data-value="20">20秒</button>
            </div>
        </div>

        <!-- 高级参数 -->
        <div class="advanced-toggle" id="advancedToggle">🎛️ 高级参数 ▼</div>
        <div class="advanced-params" id="advancedParams">
            <div class="slider-group">
                <div class="slider-label">
                    <span>Temperature（创意程度）</span>
                    <span id="tempValue">1.0</span>
                </div>
                <input type="range" id="temperature" min="0.1" max="2.0" step="0.1" value="1.0">
            </div>
            <div class="slider-group">
                <div class="slider-label">
                    <span>Top-K（多样性）</span>
                    <span id="topkValue">250</span>
                </div>
                <input type="range" id="topK" min="0" max="1000" step="10" value="250">
            </div>
            <div class="slider-group">
                <div class="slider-label">
                    <span>Top-P（采样范围）</span>
                    <span id="toppValue">0.95</span>
                </div>
                <input type="range" id="topP" min="0.0" max="1.0" step="0.05" value="0.95">
            </div>
        </div>

        <!-- 生成按钮 -->
        <button class="generate-btn" id="generateBtn" onclick="handleGenerate()">
            🎵 生成音乐
        </button>
    </div>

    <!-- 加载动画 -->
    <div class="loading-section" id="loadingSection">
        <div class="loading-bars">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="loading-text" id="loadingText">🎵 AI 正在创作音乐，请稍候...</div>
    </div>

    <!-- 播放器 -->
    <div class="player-section" id="playerSection">
        <div class="player-header">
            <span class="player-title" id="playerTitle">生成的音乐</span>
            <span class="player-info" id="playerInfo"></span>
        </div>
        <audio controls class="audio-player" id="audioPlayer"></audio>
        <div class="player-actions">
            <button class="btn btn-download" id="downloadBtn" onclick="handleDownload()">⬇️ 下载</button>
            <button class="btn btn-regenerate" onclick="handleGenerate()">🔄 重新生成</button>
        </div>
    </div>

</main>

<!-- Toast 提示 -->
<div class="toast" id="toast"></div>

<script src="js/api.js"></script>
<script>
    // ========== 状态变量 ==========
    let selectedStyle = null;
    let selectedDuration = 10;
    let currentMusicId = null;

    // 离线兜底风格列表（后端连不上时使用）
    const DEFAULT_STYLES = [
        {id: "happy", name: "欢快", prompt_en: "happy upbeat cheerful music", icon: "😊"},
        {id: "sad", name: "悲伤", prompt_en: "sad melancholic emotional music", icon: "😢"},
        {id: "epic", name: "史诗", prompt_en: "epic orchestral cinematic music", icon: "⚔️"},
        {id: "electronic", name: "电子", prompt_en: "electronic dance EDM music with synthesizers", icon: "🎛️"},
        {id: "classical", name: "古典", prompt_en: "classical piano orchestral music", icon: "🎻"},
        {id: "rock", name: "摇滚", prompt_en: "rock music with electric guitar and drums", icon: "🎸"},
        {id: "jazz", name: "爵士", prompt_en: "smooth jazz music with saxophone", icon: "🎷"},
        {id: "relaxing", name: "轻松", prompt_en: "relaxing calm ambient music", icon: "🌿"},
        {id: "tense", name: "紧张", prompt_en: "tense suspenseful dramatic music", icon: "😰"},
        {id: "romantic", name: "浪漫", prompt_en: "romantic love ballad soft music", icon: "💕"},
    ];

    // ========== 初始化 ==========
    async function init() {
        // 加载风格标签
        loadStyles();
        // 绑定时长按钮
        bindDurationButtons();
        // 绑定高级参数
        bindAdvancedParams();
        // 检查服务状态
        checkStatus();
        // 定时检查状态
        setInterval(checkStatus, 10000);
    }

    // ========== 加载风格列表 ==========
    async function loadStyles() {
        let styles = DEFAULT_STYLES;
        try {
            const res = await api.getStyles();
            if (res.data && res.data.length > 0) {
                styles = res.data;
            }
        } catch (e) {
            console.warn('从后端加载风格失败，使用本地默认列表');
        }
        const container = document.getElementById('styleTags');
        container.innerHTML = '';
        styles.forEach(style => {
            const tag = document.createElement('div');
            tag.className = 'style-tag';
            tag.dataset.id = style.id;
            tag.textContent = `${style.icon} ${style.name}`;
            tag.onclick = () => toggleStyle(tag, style.id);
            container.appendChild(tag);
        });
    }

    function toggleStyle(el, styleId) {
        if (selectedStyle === styleId) {
            selectedStyle = null;
            el.classList.remove('active');
        } else {
            document.querySelectorAll('.style-tag').forEach(t => t.classList.remove('active'));
            selectedStyle = styleId;
            el.classList.add('active');
        }
    }

    // ========== 时长选择 ==========
    function bindDurationButtons() {
        document.querySelectorAll('.duration-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.duration-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedDuration = parseInt(btn.dataset.value);
            };
        });
    }

    // ========== 高级参数 ==========
    function bindAdvancedParams() {
        document.getElementById('advancedToggle').onclick = () => {
            const params = document.getElementById('advancedParams');
            params.classList.toggle('show');
        };

        document.getElementById('temperature').oninput = (e) => {
            document.getElementById('tempValue').textContent = e.target.value;
        };
        document.getElementById('topK').oninput = (e) => {
            document.getElementById('topkValue').textContent = e.target.value;
        };
        document.getElementById('topP').oninput = (e) => {
            document.getElementById('toppValue').textContent = e.target.value;
        };
    }

    // ========== 检查服务状态 ==========
    async function checkStatus() {
        try {
            const res = await api.getStatus();
            const dot = document.getElementById('statusDot');
            const label = document.getElementById('statusLabel');
            const status = res.data.status;

            dot.className = 'status-dot ' + (status === 'ready' ? 'ready' : status === 'error' ? 'error' : '');

            if (status === 'ready') {
                label.textContent = `就绪 (${res.data.device.toUpperCase()})`;
                document.getElementById('generateBtn').disabled = false;
            } else if (status === 'loading') {
                label.textContent = '模型加载中...';
                document.getElementById('generateBtn').disabled = true;
            } else {
                label.textContent = '服务异常';
                document.getElementById('generateBtn').disabled = true;
            }
        } catch (e) {
            document.getElementById('statusDot').className = 'status-dot error';
            document.getElementById('statusLabel').textContent = '未连接';
            document.getElementById('generateBtn').disabled = true;
        }
    }

    // ========== 生成音乐 ==========
    async function handleGenerate() {
        const prompt = document.getElementById('promptInput').value.trim();
        if (!prompt) {
            showToast('请输入音乐描述', 'error');
            return;
        }

        const btn = document.getElementById('generateBtn');
        const loading = document.getElementById('loadingSection');
        const player = document.getElementById('playerSection');

        // 显示加载状态
        btn.disabled = true;
        btn.textContent = '⏳ 生成中...';
        loading.classList.add('show');
        player.classList.remove('show');

        // 更新加载提示
        const tips = ['🎵 AI 正在创作音乐...', '🎶 编排旋律中...', '🎼 调整和声...', '🎹 优化节奏...'];
        let tipIndex = 0;
        const tipTimer = setInterval(() => {
            tipIndex = (tipIndex + 1) % tips.length;
            document.getElementById('loadingText').textContent = tips[tipIndex];
        }, 5000);

        try {
            const params = {
                prompt: prompt,
                style: selectedStyle,
                duration: selectedDuration,
                temperature: parseFloat(document.getElementById('temperature').value),
                top_k: parseInt(document.getElementById('topK').value),
                top_p: parseFloat(document.getElementById('topP').value),
            };

            const res = await api.generateMusic(params);

            if (res.code === 200) {
                currentMusicId = res.data.id;

                // 显示播放器
                const audio = document.getElementById('audioPlayer');
                audio.src = api.getMusicUrl(res.data.id);
                audio.load();

                document.getElementById('playerTitle').textContent = `🎵 ${prompt}`;
                document.getElementById('playerInfo').textContent =
                    `${res.data.duration}s | ${(res.data.file_size / 1024).toFixed(0)}KB | ${res.data.style || '自定义'}`;

                player.classList.add('show');
                showToast('生成成功！', 'success');

                // 自动播放
                audio.play().catch(() => {});
            }
        } catch (e) {
            showToast(e.message, 'error');
        } finally {
            clearInterval(tipTimer);
            btn.disabled = false;
            btn.textContent = '🎵 生成音乐';
            loading.classList.remove('show');
        }
    }

    // ========== 下载音频 ==========
    function handleDownload() {
        if (!currentMusicId) return;
        const a = document.createElement('a');
        a.href = api.getMusicUrl(currentMusicId);
        a.download = `music_${currentMusicId}.wav`;
        a.click();
    }

    // ========== Toast 提示 ==========
    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = `toast ${type} show`;
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ========== 启动 ==========
    init();
</script>

</body>
</html>
